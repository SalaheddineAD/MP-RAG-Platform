version: '3.8'

services:
  rag-api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PINECONE_INDEX_NAME=manufacturing-rag
    volumes:
      - ./data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Optional: Add Prometheus for metrics later
  # prometheus:
  #   image: prom/prometheus
  #   ports:
  #     - "9090:9090"